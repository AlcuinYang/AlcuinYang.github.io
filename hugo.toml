baseURL = 'https://alcuinyang.github.io'
languageCode = 'zh-CN'
title = 'Alcuin 的文字角落'
theme = 'PaperMod'

[params]
  author = 'Alcuin'
  description = '记录生活、思考与文字'
  defaultTheme = 'auto'
  disableThemeToggle = false

[params.profileMode]
  enabled = true
  title = '你好，我是 Alcuin'
  subtitle = '在这里记录文字、思考与生活'
  imageUrl = '/images/profile.png'
  imageWidth = 120
  imageHeight = 120

[[params.profileMode.buttons]]
  name = '文章'
  url = '/posts/'

[[params.profileMode.buttons]]
  name = '关于我'
  url = '/about/'

[params.homeInfoParams]
  Title = '欢迎来到我的文字角落'
  Content = '这里记录我的想法、阅读和生活片段。'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/alcuinyang'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.assets]
  disableScrollBarStyle = true

[params.cover]
  responsiveImages = true
  hidden = true
  hiddenInList = true
  hiddenInSingle = true
